plugins {
	id 'fabric-loom' version '1.15.5'   
	id 'ploceus' version '1.15.9'
	id 'maven-publish'
}   

loom {
	clientOnlyMinecraftJar()
}

ploceus {
	setIntermediaryGeneration(2)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	exceptions ploceus.raven(project.raven_build)
	signatures ploceus.sparrow(project.sparrow_build)
	nests ploceus.nests(project.nests_build)
	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

	modImplementation "org.lwjgl:lwjgl:3.4.1"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.1"
	modImplementation "org.lwjgl:lwjgl-opengl:3.4.1"

	runtimeOnly "org.lwjgl:lwjgl:3.4.1:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl:3.4.1:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl:3.4.1:natives-macos"

	runtimeOnly "org.lwjgl:lwjgl-sdl:3.4.1:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-sdl:3.4.1:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-sdl:3.4.1:natives-macos"

	runtimeOnly "org.lwjgl:lwjgl-opengl:3.4.1:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-opengl:3.4.1:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-opengl:3.4.1:natives-macos"

	modImplementation "org.jspecify:jspecify:+"  
	modImplementation "org.ow2.asm:asm-commons:+"
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        all { substitution ->
            def requested = substitution.requested
            if (requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector
                    && requested.group == "org.lwjgl") {
                substitution.useTarget(
                    "${requested.group}:${requested.module}:3.4.1",
                    "Use LWJGL 3.4.1 in the development environment"
                )
            }
        }
    }
}

def glLibDir = providers.exec {
    commandLine "find", "/nix/store", "-name", "libGL.so.1", "-print", "-quit"
}.standardOutput.asText.get().trim()
def glLibParent = glLibDir.substring(0, glLibDir.lastIndexOf('/'))

tasks.named('runClient') {
    environment "LD_LIBRARY_PATH", glLibParent + ":" + (System.getenv("LD_LIBRARY_PATH") ?: "")
}   

