plugins {
	id 'fabric-loom' version '1.15.5'
	id 'ploceus' version '1.15.9'
	id 'maven-publish'
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
				metadataSources {
					mavenPom()
					artifact()
				}
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	clientOnlyMinecraftJar()
}

ploceus {
	setIntermediaryGeneration(2)
}

configurations {
	modsRuntime
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	exceptions ploceus.raven(project.raven_build)
	signatures ploceus.sparrow(project.sparrow_build)
	nests ploceus.nests(project.nests_build)
	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

	modImplementation "org.lwjgl:lwjgl:3.4.1"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.1"
	modImplementation "org.lwjgl:lwjgl-vulkan:3.4.1"

	modImplementation "org.lwjgl:lwjgl:3.4.1:natives-linux"
	modImplementation "org.lwjgl:lwjgl:3.4.1:natives-windows"
	modImplementation "org.lwjgl:lwjgl:3.4.1:natives-macos"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.1:natives-linux"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.1:natives-windows"
	modImplementation "org.lwjgl:lwjgl-sdl:3.4.1:natives-macos"
	modImplementation "org.lwjgl:lwjgl-vulkan:3.4.1:natives-macos"

	modImplementation "org.jspecify:jspecify:+"
	modImplementation "org.ow2.asm:asm-commons:+"
	modImplementation "org.jetbrains:annotations:+"
	modImplementation "com.google.guava:guava:+"   

	compileOnly "maven.modrinth:wx17t6U9:QPGKOis1"
	compileOnly "maven.modrinth:siR15Ede:vDA5ncMN"

	modsRuntime "maven.modrinth:wx17t6U9:QPGKOis1"
	modsRuntime "maven.modrinth:siR15Ede:vDA5ncMN"
}

configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        all { substitution ->
            def requested = substitution.requested
            if (requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector
                    && requested.group == "org.lwjgl") {
                substitution.useTarget(
                    "${requested.group}:${requested.module}:3.4.1",
                    "Use LWJGL 3.4.1 in the development environment"
                )
            }
        }
    }
}

task copyMods(type: Copy) {
    from configurations.modsRuntime
    into "run/mods"
}   

runClient {
    dependsOn copyMods
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
}

jar {
    exclude 'net/minecraft/**'
}   